<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Heart Rain</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      
    }

    /* Container sits on top without blocking clicks */
    .heart-rain-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      overflow: hidden;
      z-index: 9999;
    }

    /* Individual Heart Element */
    .rain-heart {
      position: absolute;
      top: -50px;
      left: var(--l);
      font-size: var(--s);
      color: var(--c);
      filter: drop-shadow(0 0 8px var(--c));
      opacity: 0.85;

      /* Simultaneous falling and horizontal sway */
      animation:
        heartFall var(--dur) linear infinite,
        heartSway 3s ease-in-out infinite alternate;

      animation-delay: var(--d);
    }

    /* Vertical Falling Keyframes */
    @keyframes heartFall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 0.9;
      }

      90% {
        opacity: 0.9;
      }

      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Horizontal Sway Keyframes */
    @keyframes heartSway {
      0% {
        margin-left: 0;
      }

      100% {
        margin-left: var(--sway);
      }
    }
  </style>
</head>

<body>

  <!-- Random Heart Rain Container -->
  <div class="heart-rain-wrapper">
    <div class="rain-heart" style="--l: 4%;  --s: 14px; --d: 0s;   --dur: 4.2s; --c: #ff2a75; --sway: 30px;">❤️</div>
    <div class="rain-heart" style="--l: 12%; --s: 26px; --d: 1.5s; --dur: 5.8s; --c: #00e5ff; --sway: -40px;">💖</div>
    <div class="rain-heart" style="--l: 19%; --s: 18px; --d: 0.8s; --dur: 3.9s; --c: #b388ff; --sway: 50px;">💕</div>
    <div class="rain-heart" style="--l: 27%; --s: 22px; --d: 2.2s; --dur: 6.1s; --c: #ff80ab; --sway: -25px;">💗</div>
    <div class="rain-heart" style="--l: 35%; --s: 16px; --d: 0.3s; --dur: 4.7s; --c: #ff5252; --sway: 35px;">🤍</div>
    <div class="rain-heart" style="--l: 43%; --s: 28px; --d: 1.1s; --dur: 5.2s; --c: #00e5ff; --sway: -50px;">🩵</div>
    <div class="rain-heart" style="--l: 51%; --s: 15px; --d: 2.8s; --dur: 3.5s; --c: #ff2a75; --sway: 20px;">❤️</div>
    <div class="rain-heart" style="--l: 59%; --s: 24px; --d: 0.5s; --dur: 6.5s; --c: #b388ff; --sway: -35px;">💖</div>
    <div class="rain-heart" style="--l: 67%; --s: 20px; --d: 1.9s; --dur: 4.1s; --c: #ff80ab; --sway: 45px;">💕</div>
    <div class="rain-heart" style="--l: 74%; --s: 17px; --d: 0.2s; --dur: 5.0s; --c: #ff5252; --sway: -30px;">💗</div>
    <div class="rain-heart" style="--l: 82%; --s: 25px; --d: 1.7s; --dur: 4.4s; --c: #00e5ff; --sway: 40px;">🩵</div>
    <div class="rain-heart" style="--l: 89%; --s: 19px; --d: 2.5s; --dur: 5.9s; --c: #b388ff; --sway: -45px;">💖</div>
    <div class="rain-heart" style="--l: 96%; --s: 22px; --d: 0.9s; --dur: 3.8s; --c: #ff2a75; --sway: 25px;">❤️</div>
  </div>

</body>

</html>
